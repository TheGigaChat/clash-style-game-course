<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A beginner-friendly three-lane canvas battle game built with plain JavaScript."
    />
    <title>Three-Lane Battle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-page">
      <h1>Three-Lane Battle</h1>
      <p class="instructions">
        Blue: select a card and click a lane. Red in 2 Players: use 1/2,
        Up/Down, and Left Arrow.
      </p>
      <canvas id="gameCanvas" width="1000" height="640">
        Your browser does not support the canvas element.
      </canvas>
    </main>
    <script src="script.js"></script>
  </body>
</html>
